<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <base href="/">
    <title>任务控制中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: none;
            background: rgba(255,255,255,0.95);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 20px;
        }
        .online-badge {
            background: #28a745;
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        .offline-badge {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(40,167,69,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(40,167,69,0); }
            100% { box-shadow: 0 0 0 0 rgba(40,167,69,0); }
        }
        .client-item {
            background: #f8f9fa;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            border-left: 4px solid #28a745;
            transition: all 0.3s;
        }
        .client-item:hover {
            transform: translateX(5px);
            background: #e9ecef;
        }
        .log-container {
            max-height: 400px;
            overflow-y: auto;
            background: #1e1e2e;
            color: #c9d1d9;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            border-bottom: 1px solid #2d2d3a;
            padding: 8px 0;
            margin: 0;
        }
        .log-time {
            color: #6c757d;
            font-size: 11px;
        }
        .task-row:hover {
            background: #f1f3f5;
        }
        .badge-enabled {
            background: #28a745;
        }
        .badge-disabled {
            background: #dc3545;
        }
        .status-connected { background: #28a745; }
        .status-disconnected { background: #dc3545; }
        [data-bs-toggle="buttons"] .btn.active {
            background: #0d6efd;
            color: white;
        }
        .logout-btn {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            opacity: 0.8;
        }
        .logout-btn:hover {
            opacity: 1;
            color: white;
        }
        .transfer-item {
            background: #f8f9fa;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border-left: 4px solid #0d6efd;
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h2 class="mb-0"><i class="fas fa-tasks me-2"></i>任务控制中心</h2>
                    <small>实时双向推送 · 定时任务 · 多目标控制</small>
                </div>
                <div class="col-md-6 text-end">
                    <div id="connectionStatus" class="online-badge d-inline-block">
                        <i class="fas fa-wifi me-1"></i>
                        <span id="onlineCount">0</span> 台在线
                    </div>
                    <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> 退出</a>
                </div>
            </div>
        </div>
        
        <div class="card-body p-4">
            <!-- 第一行：在线客户端 + 实时日志 -->
            <div class="row mb-4">
                <div class="col-md-5">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5><i class="fas fa-desktop me-2"></i>在线客户端</h5>
                            <div id="clientList" style="max-height: 350px; overflow-y: auto;">
                                <div class="text-center text-muted py-4">加载中...</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5><i class="fas fa-history me-2"></i>实时日志 
                                <button class="btn btn-sm btn-outline-secondary float-end" onclick="clearLogsDisplay()">清空显示</button>
                            </h5>
                            <div id="logList" class="log-container">
                                <div class="text-center py-4 text-muted">暂无日志</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 操作按钮组 -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <button class="btn btn-primary btn-lg w-100" data-bs-toggle="modal" data-bs-target="#taskModal">
                        <i class="fas fa-plus-circle me-2"></i>创建定时任务
                    </button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-success btn-lg w-100" data-bs-toggle="modal" data-bs-target="#uploadModal">
                        <i class="fas fa-upload me-2"></i>上传文件
                    </button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-info btn-lg w-100" data-bs-toggle="modal" data-bs-target="#transfersModal">
                        <i class="fas fa-exchange-alt me-2"></i>传输任务
                    </button>
                </div>
            </div>
            
            <!-- 任务列表 -->
            <h5><i class="fas fa-list me-2"></i>定时任务列表</h5>
            <div class="table-responsive">
                <table class="table table-hover table-striped" id="taskTable">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>名称</th><th>时间</th><th>星期</th><th>类型</th><th>参数</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="taskTableBody"><tr><td colspan="8" class="text-center">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 任务模态框 ==================== -->
<div class="modal fade" id="taskModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-edit me-2"></i>配置定时任务</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="taskForm" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-bold">任务ID <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="id" required maxlength="64" pattern="[a-zA-Z0-9_-]+" placeholder="唯一标识，字母数字下划线">
                        <small class="text-muted">唯一标识符，创建后不可修改</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">任务名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" required maxlength="100">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">小时</label>
                            <select class="form-select" name="hour" required id="hourSelect"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">分钟</label>
                            <select class="form-select" name="minute" required id="minuteSelect"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">执行星期</label>
                            <div id="weekdayGroup" class="mt-2" data-bs-toggle="buttons">
                                <div class="btn-group flex-wrap" role="group">
                                    <input type="checkbox" class="btn-check" id="weekday0" name="weekdays" value="0" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="weekday0">日</label>
                                    <input type="checkbox" class="btn-check" id="weekday1" name="weekdays" value="1" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="weekday1">一</label>
                                    <input type="checkbox" class="btn-check" id="weekday2" name="weekdays" value="2" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="weekday2">二</label>
                                    <input type="checkbox" class="btn-check" id="weekday3" name="weekdays" value="3" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="weekday3">三</label>
                                    <input type="checkbox" class="btn-check" id="weekday4" name="weekdays" value="4" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="weekday4">四</label>
                                    <input type="checkbox" class="btn-check" id="weekday5" name="weekdays" value="5" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="weekday5">五</label>
                                    <input type="checkbox" class="btn-check" id="weekday6" name="weekdays" value="6" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="weekday6">六</label>
                                </div>
                                <button type="button" class="btn btn-sm btn-link" onclick="toggleAllWeekdays()">全选/取消</button>
                            </div>
                            <small class="text-muted">留空表示每天执行，可多选</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">任务类型</label>
                        <select class="form-select" name="type" id="taskType" required onchange="toggleFields()">
                            <option value="wallpaper_lock">🔒 锁定壁纸</option>
                            <option value="wallpaper_reset">🔓 解锁壁纸</option>
                            <option value="msgbox">💬 弹窗消息</option>
                            <option value="exec_cmd">🖥️ 执行CMD</option>
                            <option value="exec_ps">📜 执行PowerShell</option>
                            <option value="open_url">🌐 打开网页</option>
                            <option value="open_url_on_desktop">🖼️ 指定虚拟桌面打开网页</option>
                            <option value="create_new_desktop_and_open">✨ 新建桌面打开网页</option>
                            <option value="update_config">⚙️ 更新配置</option>
                        </select>
                    </div>
                    <div class="mb-3" id="payloadGroup">
                        <label class="form-label fw-bold">参数内容</label>
                        <textarea class="form-control" name="payload" rows="3" maxlength="10240" placeholder="根据任务类型填写对应内容"></textarea>
                        <small class="text-muted" id="payloadHint">💡 弹窗消息填文字，打开网页填URL，执行命令填命令代码</small>
                    </div>
                    <div id="configGroup" style="display:none;">
                        <div class="mb-3"><label>新WebSocket地址</label><input type="url" class="form-control" name="config_ws_url"></div>
                        <div class="mb-3"><label>新Token</label><input type="text" class="form-control" name="config_token"></div>
                    </div>
                    <div class="mb-3" id="desktopGuidGroup" style="display:none;">
                        <label>虚拟桌面GUID</label>
                        <input type="text" class="form-control" name="desktop_guid" placeholder="{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}">
                        <small class="text-muted">使用"列出虚拟桌面"功能获取GUID</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveTaskBtn">保存任务</button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 文件上传模态框 ==================== -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-upload me-2"></i>上传文件到被控端</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">选择文件</label>
                        <input type="file" class="form-control" name="file" id="uploadFile" required>
                        <small class="text-muted">最大100MB</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">目标路径</label>
                        <input type="text" class="form-control" name="target_path" value="C:\\Users\\Public\\Downloads" placeholder="例如: C:\\Users\\Public\\Downloads">
                        <small class="text-muted">被控端保存文件的目录</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">目标客户端</label>
                        <select class="form-select" name="target" id="uploadTarget">
                            <option value="">所有在线客户端</option>
                        </select>
                        <small class="text-muted">留空则发送给所有在线设备</small>
                    </div>
                    <div id="uploadProgress" style="display:none;">
                        <div class="progress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%"></div>
                        </div>
                        <div class="text-center mt-2" id="uploadStatus">准备中...</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" id="uploadBtn">开始上传</button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 传输任务模态框 ==================== -->
<div class="modal fade" id="transfersModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="fas fa-exchange-alt me-2"></i>文件传输任务</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="transfersList" class="list-group"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== 配置 ====================
const API_BASE = '/api/v1';
const POLL_INTERVAL = 5000;
const TASK_REFRESH_INTERVAL = 30000;

let retryCount = 0;

// ==================== API调用封装 ====================
async function apiFetch(endpoint, options = {}) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    
    try {
        const res = await fetch(API_BASE + endpoint, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                ...options.headers,
            },
            credentials: 'same-origin',
            signal: controller.signal,
        });
        
        clearTimeout(timeout);
        
        if (res.status === 401) {
            window.location.href = '/login';
            throw new Error('未登录');
        }
        if (res.status === 429) {
            throw new Error('请求过于频繁，请稍后再试');
        }
        
        const result = await res.json();
        if (!result.success) {
            throw new Error(result.error || '请求失败');
        }
        return result.data;
    } catch (err) {
        if (err.name === 'AbortError') {
            throw new Error('请求超时');
        }
        throw err;
    }
}

// ==================== 带退避的数据加载 ====================
async function loadWithRetry(fn, name) {
    try {
        await fn();
        retryCount = 0;
    } catch (err) {
        console.error(`${name}加载失败:`, err);
        retryCount++;
        if (retryCount <= 3) {
            setTimeout(() => loadWithRetry(fn, name), 5000 * retryCount);
        }
        if (name === '客户端') {
            document.getElementById('onlineCount').innerText = '?';
        }
    }
}

// ==================== 初始化 ====================
function initTimeSelects() {
    const hourSelect = document.getElementById('hourSelect');
    for(let i = 0; i < 24; i++) {
        hourSelect.innerHTML += `<option value="${i.toString().padStart(2,'0')}">${i.toString().padStart(2,'0')}时</option>`;
    }
    
    const minuteSelect = document.getElementById('minuteSelect');
    for(let m = 0; m < 60; m++) {
        minuteSelect.innerHTML += `<option value="${m.toString().padStart(2,'0')}">${m.toString().padStart(2,'0')}分</option>`;
    }
}

function toggleFields() {
    const type = document.getElementById('taskType').value;
    const isConfigUpdate = type === 'update_config';
    const isDesktopOpen = type === 'open_url_on_desktop';
    const isNewDesktop = type === 'create_new_desktop_and_open';
    
    document.getElementById('payloadGroup').style.display = isConfigUpdate ? 'none' : 'block';
    document.getElementById('configGroup').style.display = isConfigUpdate ? 'block' : 'none';
    document.getElementById('desktopGuidGroup').style.display = isDesktopOpen ? 'block' : 'none';
    
    if (isNewDesktop) {
        document.getElementById('desktopGuidGroup').style.display = 'none';
    }
    
    const hint = document.getElementById('payloadHint');
    if(type === 'msgbox') hint.innerHTML = '💬 弹窗消息内容，例如："该休息了！"';
    else if(type === 'exec_cmd') hint.innerHTML = '🖥️ CMD命令，例如："ipconfig /all"';
    else if(type === 'exec_ps') hint.innerHTML = '📜 PowerShell命令，例如："Get-Process"';
    else if(type === 'open_url') hint.innerHTML = '🌐 网页URL，例如："https://www.bilibili.com"';
    else if(type === 'open_url_on_desktop') hint.innerHTML = '🌐 网页URL + 填写上方GUID';
    else if(type === 'create_new_desktop_and_open') hint.innerHTML = '🌐 网页URL，会自动创建新桌面打开';
    else hint.innerHTML = '根据任务类型填写对应内容';
}

function toggleAllWeekdays() {
    const checkboxes = document.querySelectorAll('input[name="weekdays"]');
    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
    checkboxes.forEach(cb => cb.checked = !allChecked);
}

function formatWeekdays(weekdaysStr) {
    if (!weekdaysStr) return '每天';
    const map = {'0':'日','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六'};
    const list = weekdaysStr.split(',').map(w => map[w] || w);
    return list.join('、');
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ==================== 数据加载 ====================
async function loadClients() {
    const clients = await apiFetch('/clients');
    const onlineCount = clients.length;
    document.getElementById('onlineCount').innerText = onlineCount;
    
    const clientDiv = document.getElementById('clientList');
    if (onlineCount === 0) {
        clientDiv.innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-plug fa-2x mb-2 d-block"></i>暂无设备在线</div>';
    } else {
        clientDiv.innerHTML = clients.map(c => `
            <div class="client-item">
                <i class="fas fa-laptop-code me-2 text-success"></i>
                <strong>${escapeHtml(c.id)}</strong><br>
                <small class="text-muted"><i class="far fa-clock me-1"></i>最后活跃: ${new Date(c.last_seen).toLocaleString()}</small>
            </div>
        `).join('');
    }
}

async function loadLogs() {
    const logs = await apiFetch('/logs');
    const logDiv = document.getElementById('logList');
    if (!logs || logs.length === 0) {
        logDiv.innerHTML = '<div class="text-center py-4 text-muted"><i class="fas fa-inbox fa-2x mb-2 d-block"></i>暂无日志</div>';
    } else {
        logDiv.innerHTML = logs.slice(0, 50).map(log => `
            <div class="log-entry">
                <div><span class="log-time">[${new Date(log.timestamp).toLocaleTimeString()}]</span> 
                <strong>${escapeHtml(log.from || '?')}</strong></div>
                <div style="word-break: break-all;">${escapeHtml(log.payload || '')}</div>
            </div>
        `).join('');
    }
}

function clearLogsDisplay() {
    document.getElementById('logList').innerHTML = '<div class="text-center py-4 text-muted">显示已清空</div>';
}

async function loadTasks() {
    const tasks = await apiFetch('/tasks');
    const tbody = document.getElementById('taskTableBody');
    if (!tasks || tasks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4"><i class="fas fa-calendar-alt fa-2x mb-2 d-block"></i>暂无定时任务</td></tr>';
    } else {
        tbody.innerHTML = tasks.map(task => `
            <tr class="task-row">
                <td><code>${escapeHtml(task.id)}</code></td>
                <td><strong>${escapeHtml(task.name)}</strong></td>
                <td>${task.schedule || '未设置'}</td>
                <td>${formatWeekdays(task.weekdays)}</td>
                <td><span class="badge bg-info">${escapeHtml(task.type)}</span></td>
                <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(task.payload || '')}">${escapeHtml(task.payload || '')}</td>
                <td><span class="badge ${task.enabled ? 'bg-success' : 'bg-secondary'}">${task.enabled ? '启用' : '禁用'}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-success me-1" onclick="runTask('${task.id}')" title="立即执行"><i class="fas fa-play"></i></button>
                    <button class="btn btn-sm btn-outline-warning me-1" onclick="toggleTask('${task.id}')" title="启用/禁用"><i class="fas fa-power-off"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTask('${task.id}')" title="删除"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }
}

async function runTask(id) {
    if (!confirm('立即执行此任务？所有在线设备都会收到指令。')) return;
    await apiFetch(`/tasks/${id}/run`, { method: 'POST' });
    alert('指令已发送');
}

async function toggleTask(id) {
    await apiFetch(`/tasks/${id}/toggle`, { method: 'PATCH' });
    loadTasks();
}

async function deleteTask(id) {
    if (!confirm('确定删除此任务？')) return;
    await apiFetch(`/tasks/${id}`, { method: 'DELETE' });
    loadTasks();
}

async function saveTask() {
    const form = document.getElementById('taskForm');
    const fd = new FormData(form);
    
    const data = {
        id: fd.get('id'),
        name: fd.get('name'),
        schedule: `${fd.get('hour')}:${fd.get('minute')}`,
        type: fd.get('type'),
        payload: fd.get('payload') || '',
        enabled: true,
    };
    
    if (!data.id || !data.name || data.schedule === ':') {
        alert('请填写任务ID、名称和时间');
        return;
    }
    
    const weekdays = Array.from(document.querySelectorAll('input[name="weekdays"]:checked')).map(cb => cb.value);
    if (weekdays.length > 0 && weekdays.length < 7) {
        data.weekdays = weekdays.join(',');
    }
    
    if (data.type === 'update_config') {
        data.config = {
            ws_url: fd.get('config_ws_url') || '',
            token: fd.get('config_token') || '',
        };
    }
    
    if (data.type === 'open_url_on_desktop') {
        const desktopGuid = fd.get('desktop_guid');
        if (desktopGuid) data.desktop_guid = desktopGuid;
    }
    
    await apiFetch('/tasks', {
        method: 'POST',
        body: JSON.stringify(data),
    });
    
    alert('任务已保存');
    bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
    form.reset();
    document.querySelectorAll('input[name="weekdays"]').forEach(cb => cb.checked = false);
    toggleFields();
    loadTasks();
}

// ==================== 文件传输 ====================
async function updateUploadTargets() {
    const clients = await apiFetch('/clients');
    const select = document.getElementById('uploadTarget');
    select.innerHTML = '<option value="">所有在线客户端</option>' + 
        clients.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.id)}</option>`).join('');
}

async function uploadFile() {
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('uploadFile');
    const target = document.getElementById('uploadTarget').value;
    const targetPath = document.querySelector('input[name="target_path"]').value;
    
    if (!fileInput.files || fileInput.files.length === 0) {
        alert('请选择文件');
        return;
    }
    
    const file = fileInput.files[0];
    if (file.size > 100 * 1024 * 1024) {
        alert('文件超过100MB限制');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', file);
    if (targetPath) formData.append('target_path', targetPath);
    
    const progressDiv = document.getElementById('uploadProgress');
    const progressBar = progressDiv.querySelector('.progress-bar');
    const statusDiv = document.getElementById('uploadStatus');
    progressDiv.style.display = 'block';
    progressBar.style.width = '0%';
    statusDiv.innerText = '上传中...';
    
    try {
        const res = await fetch(API_BASE + '/upload?target=' + encodeURIComponent(target), {
            method: 'POST',
            body: formData,
            credentials: 'same-origin',
        });
        
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;
            if (progress >= 100) {
                clearInterval(interval);
                progressBar.style.width = '100%';
                statusDiv.innerText = '传输完成！';
                setTimeout(() => {
                    progressDiv.style.display = 'none';
                    bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
                    form.reset();
                }, 1500);
            } else {
                progressBar.style.width = progress + '%';
                statusDiv.innerText = `传输中... ${progress}%`;
            }
        }, 500);
        
    } catch (err) {
        statusDiv.innerText = '传输失败: ' + err.message;
        progressBar.classList.add('bg-danger');
    }
}

async function loadTransfers() {
    const transfers = await apiFetch('/transfers');
    const container = document.getElementById('transfersList');
    if (!transfers || transfers.length === 0) {
        container.innerHTML = '<div class="text-center text-muted py-4">暂无传输任务</div>';
        return;
    }
    
    container.innerHTML = transfers.map(t => `
        <div class="transfer-item">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <strong>${escapeHtml(t.filename)}</strong><br>
                    <small>大小: ${(t.size / 1024 / 1024).toFixed(2)} MB | 
                    目标: ${escapeHtml(t.target_path)} | 
                    状态: <span class="badge ${t.status === 'completed' ? 'bg-success' : t.status === 'transferring' ? 'bg-warning' : 'bg-secondary'}">${t.status}</span></small>
                </div>
                ${t.status === 'transferring' ? `
                <button class="btn btn-sm btn-danger" onclick="cancelTransfer('${t.id}')">取消</button>
                ` : ''}
            </div>
            ${t.total_chunks > 0 ? `
            <div class="progress mt-2">
                <div class="progress-bar" style="width: ${(t.sent_chunks / t.total_chunks * 100)}%"></div>
            </div>
            <small>进度: ${t.sent_chunks}/${t.total_chunks} 分块</small>
            ` : ''}
        </div>
    `).join('');
}

async function cancelTransfer(id) {
    if (!confirm('确定取消此传输任务？')) return;
    await apiFetch(`/transfers/${id}`, { method: 'DELETE' });
    loadTransfers();
}

// ==================== 启动 ====================
document.addEventListener('DOMContentLoaded', () => {
    initTimeSelects();
    toggleFields();
    
    loadWithRetry(loadClients, '客户端');
    loadWithRetry(loadLogs, '日志');
    loadWithRetry(loadTasks, '任务');
    
    setInterval(() => loadWithRetry(loadClients, '客户端'), POLL_INTERVAL);
    setInterval(() => loadWithRetry(loadLogs, '日志'), POLL_INTERVAL);
    setInterval(() => loadWithRetry(loadTasks, '任务'), TASK_REFRESH_INTERVAL);
    setInterval(() => { if (document.getElementById('uploadTarget')) updateUploadTargets(); }, 10000);
    setInterval(() => { if (document.getElementById('transfersModal')?.classList.contains('show')) loadTransfers(); }, 3000);
    
    document.getElementById('saveTaskBtn').addEventListener('click', saveTask);
    document.getElementById('uploadBtn').addEventListener('click', uploadFile);
    
    document.getElementById('taskModal').addEventListener('hidden.bs.modal', () => {
        document.getElementById('taskForm').reset();
        document.querySelectorAll('input[name="weekdays"]').forEach(cb => cb.checked = false);
        toggleFields();
    });
    
    document.getElementById('transfersModal').addEventListener('show.bs.modal', loadTransfers);
});
</script>
